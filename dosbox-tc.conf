[sdl]
fullscreen        = false
fulldouble        = false
fullresolution    = desktop
windowresolution  = 1280x800
windowposition    = ,
display           = 0
output            = opengl
autolock          = false
autolock_feedback = none
middle_unlock     = auto
clip_mouse_button = right
clip_key_modifier = none
clip_paste_bios   = true
clip_paste_speed  = 10
sensitivity       = 100
usesystemcursor   = true
mouse_emulation   = integration
priority          = higher,normal
titlebar          = Turbo C++ 3.0 (Host Clipboard Enabled - Right Click or Ctrl+F6 to Paste)
showmenu          = true

[dosbox]
title             = Turbo C++ 3.0
memsize           = 32
fastbioslogo      = true

[render]
aspect            = true
scaler            = normal2x

[cpu]
core              = normal
cputype           = auto
cycles            = max

[dos]
xms               = true
ems               = true
umb               = true
dos clipboard device enable = true
dos clipboard device name   = CLIP$
dos clipboard api           = true

[autoexec]
@echo off
mount c .
c:
cd \BIN
tc.exe
exit
